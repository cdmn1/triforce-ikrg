name: Inspect Triforce source RVZ

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Existing Dropbox direct-download link (use dl=1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Download and inspect GameCube RVZ
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download source image privately
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_URL"
          mkdir -p "$RUNNER_TEMP/triforce-inspect"
          curl --fail --location --silent --show-error --retry 3 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/triforce-inspect/source.rvz"
          test -s "$RUNNER_TEMP/triforce-inspect/source.rvz"
          echo "Downloaded source image to ephemeral runner storage."
          stat --printf='Source size: %s bytes\n' "$RUNNER_TEMP/triforce-inspect/source.rvz"
          sha256sum "$RUNNER_TEMP/triforce-inspect/source.rvz"

      - name: Build RVZ conversion utility
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev
          git clone --depth 1 https://github.com/dnutt/iso2rvz.git "$RUNNER_TEMP/iso2rvz"

          # iso2rvz's wrapper expects a root CMakeLists.txt, while upstream
          # Zstandard keeps its CMake project under build/cmake. Supply a
          # small forwarding file so add_subdirectory(zstd) reaches it.
          rm -rf "$RUNNER_TEMP/iso2rvz/externals/zstd/zstd"
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git \
            "$RUNNER_TEMP/iso2rvz/externals/zstd/zstd"
          test -f "$RUNNER_TEMP/iso2rvz/externals/zstd/zstd/build/cmake/CMakeLists.txt"
          printf 'add_subdirectory(build/cmake)\n' > "$RUNNER_TEMP/iso2rvz/externals/zstd/zstd/CMakeLists.txt"
          echo "Zstandard source revision:"
          git -C "$RUNNER_TEMP/iso2rvz/externals/zstd/zstd" rev-parse HEAD

          cmake -S "$RUNNER_TEMP/iso2rvz" -B "$RUNNER_TEMP/iso2rvz/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C "$RUNNER_TEMP/iso2rvz/build"
          test -x "$RUNNER_TEMP/iso2rvz/build/iso2rvz"

      - name: Convert RVZ to temporary ISO
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/iso2rvz/build/iso2rvz" -b iso "$RUNNER_TEMP/triforce-inspect/source.rvz"
          test -s "$RUNNER_TEMP/triforce-inspect/source.iso" || {
            echo "Expected ISO output was not created; listing temporary directory:"
            ls -lah "$RUNNER_TEMP/triforce-inspect"
            exit 1
          }

      - name: Inspect GameCube boot header, apploader, DOL and FST
        run: |
          python3 - "$RUNNER_TEMP/triforce-inspect/source.iso" <<'PY'
          import os, struct, sys
          p = sys.argv[1]
          size = os.path.getsize(p)
          with open(p, "rb") as f:
              def read_at(off, n):
                  f.seek(off)
                  return f.read(n)
              boot = read_at(0, 0x440)
              if len(boot) < 0x440:
                  raise SystemExit("FAIL: image is too small for a GameCube boot header")
              magic = struct.unpack_from(">I", boot, 0x1C)[0]
              print("IMAGE SIZE:", size)
              print("GAME ID:", boot[0:4].decode("ascii", "replace"))
              print("MAKER:", boot[4:6].decode("ascii", "replace"))
              print("DISC NUMBER:", boot[6])
              print("DISC VERSION:", boot[7])
              print("BOOT MAGIC: 0x%08X" % magic)
              if magic != 0xC2339F3D:
                  raise SystemExit("FAIL: expected GameCube disc magic 0xC2339F3D")
              dol_off, fst_off, fst_size, fst_max = struct.unpack_from(">IIII", boot, 0x420)
              print("DOL OFFSET: 0x%X" % dol_off)
              print("FST OFFSET: 0x%X" % fst_off)
              print("FST SIZE: 0x%X" % fst_size)
              print("FST MAX SIZE: 0x%X" % fst_max)
              app = read_at(0x2440, 0x20)
              if len(app) == 0x20:
                  date = app[:10].split(b"\0",1)[0].decode("ascii","replace")
                  app_entry, code_sz, trailer_sz = struct.unpack_from(">III", app, 0x10)
                  print("APPLOADER DATE:", date)
                  print("APPLOADER ENTRY: 0x%08X" % app_entry)
                  print("APPLOADER CODE SIZE:", code_sz)
                  print("APPLOADER TRAILER SIZE:", trailer_sz)
              if not dol_off or dol_off + 0x100 > size:
                  raise SystemExit("FAIL: DOL offset is invalid")
              dol = read_at(dol_off, 0x100)
              text_off = struct.unpack_from(">7I", dol, 0x00)
              data_off = struct.unpack_from(">11I", dol, 0x1C)
              text_sz = struct.unpack_from(">7I", dol, 0x90)
              data_sz = struct.unpack_from(">11I", dol, 0xAC)
              dol_entry = struct.unpack_from(">I", dol, 0xE0)[0]
              sections = [(o,s) for o,s in zip(text_off+data_off, text_sz+data_sz) if o and s]
              print("DOL ENTRY: 0x%08X" % dol_entry)
              print("DOL SECTIONS:", len(sections))
              for i,(o,s) in enumerate(sections):
                  print("  DOL[%02d] file=0x%X size=0x%X%s" % (i,o,s," OK" if o+s <= size else " OUT OF RANGE"))
                  if o+s > size:
                      raise SystemExit("FAIL: DOL section exceeds image")
              if not dol_entry or not sections:
                  raise SystemExit("FAIL: DOL header is incomplete")
              if not fst_off or not fst_size or fst_off + fst_size > size:
                  raise SystemExit("FAIL: FST range is invalid")
              fst = read_at(fst_off, fst_size)
              if len(fst) < 12:
                  raise SystemExit("FAIL: FST is too small")
              count = struct.unpack_from(">I", fst, 8)[0]
              if count == 0 or count * 12 > len(fst):
                  raise SystemExit("FAIL: FST entry count is invalid")
              strings = count * 12
              names = []
              for i in range(count):
                  typ_name, a, b = struct.unpack_from(">III", fst, i*12)
                  noff = typ_name & 0xFFFFFF
                  end = fst.find(b"\0", strings + noff)
                  name = "?" if end < 0 else fst[strings+noff:end].decode("utf-8","replace")
                  names.append((bool(typ_name >> 24), name, a, b))
              # FST entry zero is the root directory; its end index is in b.
              root_end = names[0][3]
              stack = [(root_end, "")]
              found = []
              for i,(isdir,name,a,b) in enumerate(names[1:], start=1):
                  while len(stack) > 1 and i >= stack[-1][0]:
                      stack.pop()
                  path = (stack[-1][1] + "/" + name).strip("/")
                  if isdir:
                      stack.append((b, path))
                  elif path.lower().startswith("sys/") or path.lower() in ("boot.bin","bi2.bin"):
                      found.append((path,a,b))
              print("SYSTEM FILES IN FST:")
              for path,off,n in found:
                  print("  %s offset=0x%X size=0x%X" % (path,off,n))
              print("RESULT: GameCube disc header, apploader, DOL and FST are structurally readable.")
          PY

      - name: Remove temporary game image
        if: always()
        run: rm -rf "$RUNNER_TEMP/triforce-inspect" "$RUNNER_TEMP/iso2rvz"
