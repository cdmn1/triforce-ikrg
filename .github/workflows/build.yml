name: Build Triforce Hello World

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GameCube DOL
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20261102

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          export PATH="${DEVKITPPC}/bin:${DEVKITPRO}/tools/bin:${PATH}"
          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITPPC=${DEVKITPPC}"
          echo "PATH=${PATH}"
          test -x "${DEVKITPPC}/bin/powerpc-eabi-gcc"
          powerpc-eabi-gcc --version
          make --version
          command -v elf2dol

      - name: Build
        run: |
          make clean
          make

      - name: Validate DOL
        run: |
          test -s triforce-hello.dol
          python3 scripts/validate_dol.py triforce-hello.dol

      - name: Test experimental Triforce payload packager
        run: |
          python3 -m unittest discover -s tests -v

      - name: Create versioned artifact
        run: |
          mkdir -p dist
          cp triforce-hello.dol dist/triforce-hello-v01.dol
          cp scripts/package_triforce_netboot.py dist/package_triforce_netboot.py
          sha256sum dist/triforce-hello-v01.dol dist/package_triforce_netboot.py > dist/SHA256SUMS.txt
          {
            echo "Triforce Hello World v01"
            echo "Commit: $GITHUB_SHA"
            echo "Container: devkitpro/devkitppc:20261102"
            echo "Artifact files:"
            echo "  triforce-hello-v01.dol"
            echo "  package_triforce_netboot.py"
          } > dist/BUILD-INFO.txt

      - name: Upload build and packaging tools
        uses: actions/upload-artifact@v4
        with:
          name: triforce-hello-v01
          path: dist/
          if-no-files-found: error
